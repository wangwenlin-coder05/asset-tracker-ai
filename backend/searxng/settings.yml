# 由本服务自动生成的 SearXNG 配置：本文件是「快照」，启动时会按 search-env.js 里的 SETTINGS_TEMPLATE 重写，
# 想永久改引擎请改 SETTINGS_TEMPLATE，直接改本文件只在本次运行内有效。
# 只保留国内可直连的中文引擎：SearXNG 默认那批（Google/Brave/DuckDuckGo/Wikipedia）在国内全部超时，
# 而国际版 Bing 又会混入大量外文日历类垃圾页；keep_only 只留下面这套中文组合。
# baidu + sogou + 360search + quark 覆盖全网网页，chinaso（中国搜索）gov 内容权重高、专补政务类检索。
# 注意：知乎引擎（zhihu）在 SearXNG 当前版本里并不存在，想要知乎经验类内容只能靠网页链里的其他源带回。
use_default_settings:
  engines:
    keep_only:
      - baidu
      - sogou
      - 360search
      - quark
      - chinaso

server:
  secret_key: "life-planner-local-searxng"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  - name: baidu
    disabled: false
    page_size: 20
    paging: true
    max_page: 3
  - name: sogou
    engine: sogou
    disabled: false
    page_size: 20
    paging: true
    max_page: 3
  - name: 360search
    engine: 360search
    disabled: false
    page_size: 20
    paging: true
    max_page: 3
  # quark / chinaso 引擎自带 results_per_page=10，这里如实按 10 配置，避免向上游多要
  - name: quark
    engine: quark
    disabled: false
    page_size: 10
    paging: true
    max_page: 3
  - name: chinaso
    engine: chinaso
    disabled: false
    page_size: 10
    paging: true
    max_page: 3
