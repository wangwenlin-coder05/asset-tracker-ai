name: quant-ci

on:
  push:
    paths: ["quant/**", ".github/workflows/quant-ci.yml"]
  pull_request:
    paths: ["quant/**"]

defaults:
  run:
    working-directory: quant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: quant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check quant tests

      - name: Test
        run: |
          python -m pytest tests -v